<text x="622.0" y="117" fill="#333" font-size="11">• he dresses every stone at the banker (51, −88.8);</text>
<text x="622.0" y="134" fill="#333" font-size="11">  the slot runs east ≈ 11 amot a stone</text>
<text x="622.0" y="151" fill="#333" font-size="11">• past stone 3 it is > 46 amot away:</text>
<text x="622.0" y="168" fill="#333" font-size="11">  wallView frames the slot alone</text>
<text x="622.0" y="185" fill="#333" font-size="11">• stone 8: at the NE corner, 95 amot away</text>
<text x="622.0" y="202" fill="#333" font-size="11">• ≈ stone 11 on: the slot tours the court</text>
<text x="622.0" y="219" fill="#333" font-size="11"></text>
<text x="622.0" y="236" fill="#333" font-size="11" font-weight="bold">The call (⚑W):</text>
<text x="622.0" y="253" fill="#333" font-size="11">• his stones rise on ONE stretch round</text>
<text x="622.0" y="270" fill="#333" font-size="11">  the NE corner, one stone at the marked slot</text>
<text x="622.0" y="287" fill="#333" font-size="11">• the crane, the stock and the banker at the</text>
<text x="622.0" y="304" fill="#333" font-size="11">  corner; carts down from the quarry</text>
<text x="622.0" y="321" fill="#333" font-size="11">• both keys of a course ON the corner, so</text>
<text x="622.0" y="338" fill="#333" font-size="11">  "אבן פינה" is true</text>
<text x="622.0" y="355" fill="#333" font-size="11">• CAM.WALL-W at az −45: no 90° flip</text>
