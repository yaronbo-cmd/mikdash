<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>דגם היציקה</title>
<style>
#yz-root{position:fixed;left:0;top:0;right:0;bottom:0;overflow:hidden;background:#f3dfb8;touch-action:none;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;z-index:1}
#yz-root canvas{position:absolute;left:0;top:0;display:block;touch-action:none;outline:none}
#yz-root canvas.yz-overlay{pointer-events:none}
#yz-again{position:absolute;left:50%;bottom:9%;width:76px;height:76px;margin-left:-38px;border-radius:50%;border:4px solid #fff3d6;
  background:#f7d78f;box-shadow:0 6px 18px rgba(80,45,10,.35);display:flex;align-items:center;justify-content:center;padding:0;
  cursor:pointer;opacity:0;transform:scale(.4);pointer-events:none;transition:opacity .35s,transform .35s cubic-bezier(.3,1.6,.5,1)}
#yz-again.show{opacity:1;transform:scale(1);pointer-events:auto}
</style>
<div id="yz-root"></div>
