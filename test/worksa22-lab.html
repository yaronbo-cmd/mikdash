<!doctype html>
<html lang="he" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>worksa22 lab</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#222;touch-action:none;font-family:Heebo,Arial,sans-serif}#c{width:100%;height:100%;display:block}
.tw-btn{position:fixed;right:28px;bottom:26px;width:86px;height:86px;border-radius:50%;background:rgba(255,214,110,.88);border:3px solid #7A5A1E;color:#3B2A12;font:700 15px Heebo,Arial;display:flex;align-items:center;justify-content:center;z-index:5;user-select:none}
.tw-stick{position:fixed;left:28px;bottom:26px;width:96px;height:96px;border-radius:50%;background:rgba(255,255,255,.2);border:2px solid rgba(255,255,255,.5);z-index:5}

.lab-float{position:fixed;color:#FFE08A;font:700 22px Heebo,Arial;text-shadow:0 1px 3px #000;z-index:7;pointer-events:none;transition:transform 1s,opacity 1s}</style></head>
