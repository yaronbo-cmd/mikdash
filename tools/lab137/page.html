<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>TITLE</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#BFD3E0;font-family:Heebo,system-ui,sans-serif;-webkit-user-select:none;user-select:none}
#c{position:fixed;inset:0;width:100vw;height:100vh;display:block}
.lab-ui{position:fixed;z-index:10}
.lab-ui.lv{top:6px;left:6px;display:flex;gap:6px;direction:ltr}.lab-ui.lv button{font:700 14px system-ui;border:0;border-radius:10px;padding:8px 10px;background:#FBF6EA;color:#3A2A14;min-height:40px}.lab-ui.lv button.on{background:#C08A1A;color:#fff}
.lab-ui.score{top:6px;right:8px;font:800 22px system-ui;color:#3A2A14;background:rgba(251,246,234,.85);border-radius:10px;padding:4px 12px}
.lab-ui.line{bottom:10px;left:50%;transform:translateX(-50%);max-width:88vw;background:rgba(30,22,12,.72);color:#FFF6E0;font:600 16px Heebo,system-ui;padding:8px 14px;border-radius:12px;display:none;text-align:center;pointer-events:none}
.lab-ui.pop{transform:translate(-50%,-50%);font-weight:900;text-shadow:0 2px 4px rgba(0,0,0,.6);pointer-events:none;transition:transform 1.2s ease-out,opacity 1.2s;opacity:1}.lab-ui.pop.up{transform:translate(-50%,-160%);opacity:0}
.lab-ui.perfect{inset:0;display:grid;place-items:center;font:900 44px Heebo,system-ui;color:#FFD24A;text-shadow:0 0 24px #FFB52A,0 3px 6px #000;pointer-events:none;background:radial-gradient(circle,rgba(255,220,120,.35),transparent 70%)}
.lab-ui.card{inset:0;display:grid;place-items:center;background:rgba(14,10,4,.42)}.lab-ui.card>*{grid-area:1/1}.lab-ui.card{grid-template-rows:auto}
.lab-ui.card h3,.lab-ui.card div,.lab-ui.card button{position:relative}
.lab-ui.card{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}.lab-ui.card h3{margin:0;font-size:40px;color:#FFD24A}.lab-ui.card div{color:#fff;font:700 18px system-ui}.lab-ui.card button{font:800 18px Heebo,system-ui;border:0;border-radius:12px;padding:10px 18px;background:#C08A1A;color:#fff;min-height:44px}
.lab-ui.hand{font-size:34px;transform:translate(-50%,0);pointer-events:none}
.h137-ring{z-index:9}
</style></head><body><canvas id="c"></canvas><div id="ui"></div><script>SCRIPT</script></body></html>
