<style>html,body{margin:0;height:100%;overflow:hidden;background:#140C06;font-family:Heebo,system-ui,sans-serif;-webkit-user-select:none;user-select:none}
#c{position:fixed;inset:0;width:100vw;height:100vh;display:block}
.lab-ui{position:fixed;z-index:10}
.lab-ui.lv{top:4px;left:4px;display:flex;gap:4px;direction:ltr}.lab-ui.lv button{font:700 12px system-ui;border:0;border-radius:8px;padding:6px 8px;background:rgba(251,246,234,.75);color:#3A2A14;min-height:34px}.lab-ui.lv button.on{background:#C08A1A;color:#fff}
